<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#258e75"/>
<title>MY TRAVEL PLANNER - 오프라인</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:#f5f8f7;color:#173f59}
.card{width:min(430px,100%);padding:38px 30px;border-radius:24px;background:#fff;border:1px solid #dce9e5;
box-shadow:0 18px 48px rgba(30,74,62,.10);text-align:center}
.mark{width:64px;height:64px;margin:0 auto 18px;border-radius:19px;display:grid;place-items:center;
background:#e1f4ed;color:#258e75;font-size:31px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:#3b997f}
h1{margin:8px 0 10px;font-size:25px}p{margin:0;color:#74828b;font-size:14px;line-height:1.7}
button{margin-top:22px;border:0;border-radius:13px;padding:12px 19px;background:#258e75;color:#fff;font-weight:800;cursor:pointer}
</style>
</head>
<body><div class="card"><div class="mark">✦</div><div class="eyebrow">MY TRAVEL PLANNER</div>
<h1>인터넷 연결이 필요합니다</h1><p>여행 데이터는 웹과 앱이 같은 서버에서 동기화됩니다.<br>인터넷 연결 후 다시 시도해 주세요.</p>
<button onclick="location.reload()">다시 연결</button></div></body></html>
